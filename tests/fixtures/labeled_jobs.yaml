# Hand-labeled postings for `job-hunters eval-scoring`.
#
# Each entry is a real posting sampled from the first live ingest (September
# 2026), trimmed to its first ~2,000 characters. `relevant` says whether the
# candidate would want to see it in the digest. The labels encode one person's
# judgement of the role and not of the location. The location is reported by the
# command but never applied. `work_mode` is the board's own hint where it gave
# one, passed to the location parser exactly as an adapter would pass it.
#
# Add entries relevant to your search criteria and align them with the rubric
# in `config/search_profile.yaml`. A wrong label here makes the precision and
# recall numbers wrong. The borderline ones (see `note`) are exactly where the
# rubric needs a human's opinion.
#
# Fields: id (unique), company, title, location, work_mode, relevant, note and
# description.


