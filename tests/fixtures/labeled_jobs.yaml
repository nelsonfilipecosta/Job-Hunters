- id: openai-agent-post-training-personality
  company: OpenAI
  title: Agent Post-Training, Personality
  location: San Francisco
  work_mode: onsite
  relevant: true
  note: Post-training through evals, training data and reward signals.
  description: |
    ABOUT THE TEAM The Agent Post-Training team creates the frontier agents OpenAI ships to the
    world. We are training the models behind our agents in Codex, ChatGPT, the API, and other
    frontier products: persistent, proactive intelligence that can operate computers, collaborate
    with people and other agents, and expand what people and organizations can imagine, attempt, and
    achieve. We define what the next generation of agents should be able to do, build the training
    signal that teaches those abilities, and run the experiments that make them real. Our work spans
    coding, tool use, computer use, multi-agent coordination, long-horizon execution, factuality,
    instruction following, calibrated reasoning, and taste. Our team builds the data, environments,
    graders, training methods, and feedback loops that shape what OpenAI’s next agents can do and
    what they are like to work with, then carries those improvements through major training runs and
    into products used by people every day. ABOUT THE ROLE As a member of the Agent Post-training
    Personality team, you will help make OpenAI’s agents exceptional collaborators. You will study
    what makes an agent thoughtful, clear, perceptive, appropriately proactive, and genuinely easy
    to work with, then translate those insights into evals, training data, reward signals, and model
    improvements. We use “personality” to mean much more than writing style or general likability.
    It includes whether an agent understands what the user is trying to accomplish, communicates
    with good judgment, adapts to context, asks useful questions, handles disagreement honestly and
    takes initiative at the right moments. The goal is to create a strong, tasteful default that can
    adapt to different people and situations. This work combines behavioral research, product
    thinking, research and communication taste. You will collaborate with product teams, human
    experts, and researchers across post-training and pretraining to ensure that improvements
    survive the full training stack and reach the models people use every day.

