# Ashby's structured hints: workplaceType wins over isRemote (isRemote is True
# for Hybrid roles).
- raw: "San Francisco"
  hints: {workplace_type: Hybrid, is_remote: true}
  regions: [us]
  region: us
  work_mode: hybrid
- raw: "San Francisco"
  hints: {workplace_type: OnSite, is_remote: false}
  regions: [us]
  region: us
  work_mode: onsite
- raw: "US, UK, Remote"
  hints: {workplace_type: Remote, is_remote: true}
  regions: [us, uk]
  region: us
  work_mode: remote
- raw: "India"
  hints: {extra: ["India"]}
  regions: []
  region: other
  work_mode: onsite

# --- Lever: "City, Country" plus an ISO code and a workplaceType ------------
- raw: "London, United Kingdom"
  hints: {country_code: GB, workplace_type: hybrid}
  regions: [uk]
  region: uk
  work_mode: hybrid
- raw: "Palo Alto, CA"
  hints: {country_code: US, workplace_type: onsite}
  regions: [us]
  region: us
  work_mode: onsite
- raw: "Tokyo, Japan"
  hints: {country_code: JP, workplace_type: hybrid}
  regions: []
  region: other
  work_mode: hybrid
- raw: "Vilnius, Lithuania"
  hints: {country_code: LT, workplace_type: onsite}
  regions: [lithuania]
  region: lithuania
  work_mode: onsite
