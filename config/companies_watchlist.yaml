# Which companies to watch.
#
# Every entry below was probed live and returned a working board. Greenhouse,
# Lever and Ashby all expose free, unauthenticated JSON - no scraping and no keys.
#
# The slug is rarely the company name. Six of these 28 needed a non-obvious one
# (scale -> scaleai, together -> togetherai, perplexityai -> perplexity,
# luma -> lumaai, arize -> arizeai, liquid -> liquid-ai), which is why
# `job-hunters discover <company>` probes variants instead of guessing.
#
# Tiers are labels for your own filtering: lab | bigtech | infra | discovered.
# The Phase 5 promotion loop appends entries with tier: discovered.

