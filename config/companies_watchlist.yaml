# --- Not reachable this way ------------------------------------------------
#
# Probed under multiple slug variants, no Greenhouse/Lever/Ashby board found:
#   Mistral, Hugging Face, AI21, Contextual AI, Glean, Anysphere (Cursor),
#   Weights & Biases, Replicate, Patronus, Humanloop, Adept, Magic.
# Reachable only via the Phase 5 discovery sources (or by checking manually).
#
# Big tech splits in two. Workday tenants (NVIDIA, IBM, Intel, Adobe,
# Salesforce, Qualcomm) become available if Phase 1b is built:
#
#   - slug: nvidia
#     name: NVIDIA
#     ats: workday
#     tier: bigtech
#     ats_config: { tenant: nvidia, wd: wd5, site: NVIDIAExternalCareerSite }
#
# Google, Microsoft, Amazon, Apple and Meta run proprietary systems
# (careers.google.com, amazon.jobs, jobs.apple.com, metacareers.com) and each
# would need a bespoke adapter.
