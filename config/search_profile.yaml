# What you are looking for.
#
# Nothing here is secret. Secrets live in `.env`.

titles:
  # The prefilter keeps a job if the title matches or the keywords match - deliberately
  # generous. Letting junk through costs a fraction of a cent for the judge to
  # reject. Missing a role costs a job you never knew existed.
  include:
    - research scientist
    - research engineer
    - ai scientist
    - ai research scientist
    - ai engineer
    - ai research engineer
    - artificial intelligence scientist
    - artificial intelligence research scientist
    - artificial intelligence engineer
    - artificial intelligence research engineer
    - ml scientist
    - ml research scientist
    - ml engineer
    - ml research engineer
    - machine learning scientist
    - machine learning research scientist
    - machine learning engineer
    - machine learning research engineer
    - applied scientist
    - applied research scientist
    - applied engineer
    - applied research engineer
  # Hard prefilter. These never reach the judge.
  exclude:
    - consultant
    - sales
    - marketing
    - account executive
    - recruiter
    - counsel
    - policy lead
    - customer success
    - solutions architect

keywords:
  # Domain vocabulary specific enough that its presence alone justifies a look.
  strong:
    - RLHF
    - RLAIF
    - RLVR
    - PPO
    - GRPO
    - DPO
    - reinforcement learning
    - post-training
    - preference optimization
    - reward model
    - SFT
    - supervised fine-tuning
    - fine-tuning
  # Weaker signals to widen recall. The judge sorts out the noise later.
  supporting:
    - pre-training
    - pretraining
    - model evaluation
    - evaluation
    - evals
    - alignment
    - benchmark
    - interpretability
    - llm-as-judge
    - foundational models

seniority:
  include: [mid, senior, staff]
  exclude: [intern, trainee, manager, director]

location:
  base: portugal

  priority:
    - work_modes: [onsite, hybrid]
      regions: [portugal, switzerland]

  acceptable:
    - work_modes: [onsite, hybrid]
      regions: [canada]
    - work_modes: [remote]
      regions: [eu, switzerland, uk, us, canada]

  work_authorization:
    have: [eu, switzerland, canada]
    need_sponsorship: [uk, us]

scoring:
  # Below this value a job is stored but never shown in the digest.
  threshold: 70
  # Cap per run. The remainder carries to the next run, with oldest-unscored first.
  max_llm_scores_per_run: 300
  # Bump whenever anything below changes. It invalidates every prior score.
  prompt_version: 2

  # Everything from here down is pasted into the judge's prompt. Rewrite it to
  # fine-tune the search. The rubric tells the judge what to look for and how to weight
  # it. Required.
  rubric: |
    Weight post-training and evaluation work most heavily: RLHF/RLAIF, DPO and
    other preference optimization, reward modelling, supervised fine-tuning and
    the design of evaluations and benchmarks for language models.

    Weight second: alignment, interpretability and red-teaming research where
    the role involves running experiments rather than only writing policy.

    Weight text and language above every other modality. The core of the search
    is post-training and evaluation of language models. The same work on speech,
    audio, vision, video or robotics models is adjacent and not core, so score
    it a few points below where the equivalent text role would land. A multimodal
    role counts as text work when the language model is the centre of the job
    (post-training a VLM or evaluating text output) and as another modality when
    it is not.

    Penalize pure infrastructure and platform roles with no research component
    and roles that are primarily about deploying someone else's models.

    Do not penalize a job for being at a small company. A four-person lab doing
    post-training research is a better match than a large company's generic ML
    engineering opening.

  # How the judge turns its opinion into a number. Bands must cover 0 to 100
  # with no gap and no overlap. A gap leaves the model to invent its own meaning
  # for the scores that fall in it. Required.
  bands:
    - low: 85
      high: 100
      meaning: >
        The core of the search. Post-training or evaluation work on language
        models (RLHF, RLAIF, DPO and other preference optimization, reward
        modelling, supervised fine-tuning, RL environments, benchmark and
        evaluation design) where the candidate's background is a direct match.
    - low: 70
      high: 84
      meaning: >
        Research adjacent to the core with real experiments: alignment,
        interpretability, red-teaming, training-data quality, model behaviour or
        post-training in another modality. Also product engineering around
        fine-tuning, training or evaluation, since building that product still
        means running training jobs, curating data and designing evals. The
        candidate could credibly do the work.
    - low: 40
      high: 69
      meaning: >
        A technical role that touches the domain but is centred on something
        else: primarily deploying someone else's models through an API and
        building the software around them (prompting, retrieval, agents or
        integrations), training or inference infrastructure with no experiments
        of its own.
    - low: 10
      high: 39
      meaning: >
        Engineering or research clearly outside the domain, or a role the
        candidate is not looking for: internships, roles that are principally
        people management, director level and above.
    - low: 0
      high: 9
      meaning: >
        Not a technical research or engineering role at all: sales, marketing,
        legal, finance, recruiting, support or operations.

  # How to read a posting (appended after the bands). Optional.
  guidance: >
    Judge the work the role actually consists of, not the team it sits in or the
    words in the title: a post-training team can be hiring a Kubernetes engineer.
    Do not reward or penalize company size or prestige. A four-person lab doing
    post-training research outranks a large company's generic machine-learning
    opening. When the posting covers several possible teams or tracks, score the
    best fit among them and say which in the rationale.

  # Worked examples anchoring the scale. Optional, but a handful of them is the
  # cheapest way to correct a judge that scores too high or too low.
  examples:
    - posting: >
        "Research Scientist, Preference Learning" at a twelve-person lab: designs
        reward models and DPO variants and runs the ablations.
      score: 93
      reason: >
        The core of the search and a direct match for the candidate's work preferences.
    - posting: >
        "Research Engineer, Red Teaming": builds adversarial evaluations and runs
        robustness experiments on production models.
      score: 72
      reason: Adjacent research with real experiments.
    - posting: >
        "Machine Learning Engineer, Training Platform": maintains the distributed
        training stack that post-training teams use, with no experiments of its own.
      score: 66
      reason: Infrastructure next to the domain, not research in it.
    - posting: >
        "Research Program Manager": plans compute allocation and coordinates
        research programs.
      score: 39
      reason: Not a research or engineering role.
    - posting: >
        "Enterprise Account Executive" at an AI lab: sells to enterprise accounts.
      score: 4
      reason: Sales, however technical the product.
