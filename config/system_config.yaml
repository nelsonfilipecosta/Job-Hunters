# How the system runs.
#
# Nothing here is secret. Secrets come from `.env`:
#   SMTP_PASSWORD
#   ACTION_TOKEN_SECRET
#   ANTHROPIC_API_KEY

timezone: Europe/Lisbon

# Every link in the digest email is built from this. The code that writes those
# links runs inside the container, where `localhost` means the container itself
# and not the computer reading the email. Change it if the stack ever moves to
# another host. The port binding in `docker-compose.yml` is what keeps this
# reachable from your machine only.
base_url: http://localhost:8000

actions:
  # How long a signed "Applied" or "Dismiss" link keeps working. Long on purpose.
  # A digest can sit in an inbox for weeks and a short expiry would break links
  # you had not got to yet. This is only safe while `base_url` above points at a
  # loopback-bound port, so shorten the lifetime if the stack ever moves to a
  # host anyone else can reach.
  token_ttl_days: 90

schedules:
  # Accepted forms: "every <N><m|h|d>", "daily HH:MM", "weekly <dow> HH:MM"
  ingest:    every 2h
  score:     every 2h
  digest:    daily 08:00
  discovery: weekly mon 06:00
  backup:    weekly sun 02:00

models:
  # Cheap, fast and good enough to triage. Runs on hundreds of jobs.
  judge:   claude-haiku-4-5
  # Pulling {company, role, careers_url} out of free-form HN prose.
  extract: claude-haiku-4-5
  # Runs a few times a week on work that gets sent to a human. More expensive.
  tailor:  claude-opus-5

email:
  # The mail server only. The email adress is set in `.env`.
  smtp_host: smtp.gmail.com
  smtp_port: 587

digest:
  # An application older than this with no subsequent event gets a nudge.
  followup_after_days: 14

  repeat_suppression:
    enabled: true
    # Appearances before a job is demoted to the bottom of its section.
    demote_after: 3
    # Appearances before it is folded into a one-line "Still open (12) ->" link.
    suppress_after: 5
    # A score moving by more than this resets the appearance counter.
    reset_on_score_delta: 10
